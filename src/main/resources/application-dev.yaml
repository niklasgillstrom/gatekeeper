## Developer profile — activate with: --spring.profiles.active=dev
##
## The only thing this profile does is turn the OpenAPI document and Swagger UI
## back on. Every other profile leaves them off (see application.yaml).
## Do not deploy with this profile active.

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # The swagger-ui WebJar that pom.xml pins (org.webjars:swagger-ui). springdoc
    # serves /swagger-ui/** from the WebJar directory of the version it was
    # built with, 5.34.0 for springdoc 3.2.0; with the WebJar pinned to another
    # version and this left unset, /swagger-ui.html redirected to a 404.
    # OpenApiExposureDevProfileTest fails when the two versions differ.
    version: 5.34.1
