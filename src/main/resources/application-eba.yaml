## EBA Verification Profile
## Activate with: --spring.profiles.active=eba
##
## The profile has no EBA-specific endpoints or beans: the code contains no
## @Profile, so the same endpoints are served under every profile. It sets the
## port and keeps the OpenAPI document off; mTLS stays off and the receipt
## signer ephemeral (application.yaml defaults), which makes it the reference /
## developer profile the README describes.

server:
  port: 8080

spring:
  application:
    name: gatekeeper

# OpenAPI document and Swagger UI are off in every non-dev profile. Neither has
# a run-time function in this service, and the UI is a third-party JavaScript
# application (swagger-ui, DOMPurify) whose vulnerabilities would otherwise be
# part of the deployed surface. Enable locally with --spring.profiles.active=dev
# (application-dev.yaml).
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operationsSorter: method

