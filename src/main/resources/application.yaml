## Default application configuration for the DORA Attestation Gatekeeper.
##
## This file is loaded for every Spring profile and provides safe defaults
## for the reference (development) configuration. The production-shaped
## configuration lives in application-nca.yaml and is activated via
## --spring.profiles.active=nca.

server:
  port: 8080
  # Headers only. Spring Boot has no property that bounds a JSON request
  # body, which is why gatekeeper.limits.max-http-request-size below exists
  # and is enforced by RequestSizeLimitFilter. 8KB is the Spring default and
  # is stated here so the two limits are visible together.
  max-http-request-header-size: 8KB
  tomcat:
    # Form-encoded bodies only; the gatekeeper accepts none, so this is a
    # floor rather than a working limit. Kept small so a mistakenly
    # form-encoded request is rejected by the container.
    max-http-form-post-size: 64KB
    # How much of a rejected request body Tomcat will read and discard
    # before closing the connection. Bounds the cost of the 413 path.
    max-swallow-size: 2MB

spring:
  application:
    name: gatekeeper
  servlet:
    multipart:
      # The gatekeeper has no multipart endpoints. Set low rather than left
      # at the 10MB default so a multipart request cannot be used to get
      # around the JSON body cap.
      max-file-size: 1MB
      max-request-size: 2MB

gatekeeper:
  limits:
    # Maximum accepted HTTP request body, enforced by
    # RequestSizeLimitFilter (Spring Boot has no equivalent property for
    # non-multipart bodies — see that class's javadoc).
    #
    # Sized against the field limits in VerificationRequest: the largest
    # legitimate request is a batch of attestations, each dominated by an
    # attestation blob of at most 256 KiB. 2 MB therefore accommodates a
    # handful of full-size attestations per request, while a caller with
    # more to submit must page — which VerificationController.MAX_BATCH_SIZE
    # (200) already requires. Anything above this is malformed or hostile.
    max-http-request-size: ${GATEKEEPER_MAX_REQUEST_SIZE:2MB}
  ratelimit:
    # Comma-separated IPs or CIDRs of reverse proxies whose
    # X-Forwarded-For header may be believed when deriving a rate-limit
    # bucket key. EMPTY BY DEFAULT: with no entry the header is ignored
    # entirely and the direct peer address is the key. Set this only to
    # addresses you actually operate — a trusted entry lets whatever is
    # behind it choose its own bucket key.
    #   trusted-proxies: "10.0.0.0/8,192.168.1.10"
    trusted-proxies: ${GATEKEEPER_TRUSTED_PROXIES:}
    # Hard ceiling on how many distinct keys each bucket map may hold, and
    # how long an unused key is kept. Beyond the ceiling, new keys share one
    # overflow bucket instead of allocating, so an attacker minting keys
    # cannot grow memory without bound.
    max-tracked-keys: 10000
    key-idle-seconds: 900
  audit:
    # Tamper-evident audit log location (JSON Lines).
    # Each append is fsynced; the file is hash-chained and signed under
    # the active gatekeeper signing key. DORA Article 28(6) mandates
    # 5-year retention; rotate the path through symlinks if you wish to
    # archive periodically.
    path: ${GATEKEEPER_AUDIT_PATH:./audit-log.jsonl}
    # DORA Article 28(6) minimum retention. Documented here so operators
    # can see the legal basis without consulting external docs.
    retention-years: 5
    # How long a chain-integrity result is served before it is recomputed.
    # The walk is O(chain length) with one signature verification per entry,
    # so GET /v1/gatekeeper/health serves the cached answer plus the instant
    # it was computed rather than running the walk per request. Lower this
    # if monitoring needs a fresher answer; do not set it to 0 outside tests.
    integrity-check-interval-seconds: ${GATEKEEPER_INTEGRITY_CHECK_INTERVAL_SECONDS:300}
  registry:
    # Approval-registry backend.
    #   in-memory — ConcurrentHashMap, state lost on restart. Reference default.
    #   file      — append-only JSONL journal, fsynced per write, restart-safe.
    # The nca profile overrides this to "file".
    mode: ${GATEKEEPER_REGISTRY_MODE:in-memory}
    path: ${GATEKEEPER_REGISTRY_PATH:./approval-registry.jsonl}
  signing:
    # Reference default — generates a throwaway key at startup and
    # warns loudly. Override to "configured" in production via the nca
    # profile.
    mode: ${GATEKEEPER_SIGNING_MODE:ephemeral}
    # Comma-separated PEMs of historical signing certificates that have
    # been retired but may still appear on receipts within the 5-year
    # retention window. Embedded as a single property line so deployments
    # can splice multiple certs via env var; newlines may be encoded as
    # the two-character sequence \n.
    retired-keys: ${GATEKEEPER_RETIRED_KEYS:}
  security:
    mtls:
      enabled: ${GATEKEEPER_MTLS_ENABLED:false}

# OpenAPI document and Swagger UI are off in every non-dev profile. Neither has
# a run-time function in this service, and the UI is a third-party JavaScript
# application (swagger-ui, DOMPurify) whose vulnerabilities would otherwise be
# part of the deployed surface. Enable locally with --spring.profiles.active=dev
# (application-dev.yaml).
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    eu.gillstrom.gatekeeper: INFO
